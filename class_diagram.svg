<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
.title {font: bold 25px Arial; fill:#172554}
.box {fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}
.actor {fill:#f8fafc;stroke:#475569;stroke-width:2}
.txt {font: 17px Arial; fill:#0f172a}
.small {font: 14px Arial; fill:#334155}
.line {stroke:#475569;stroke-width:2;fill:none}
</style>
<text x="450" y="42" text-anchor="middle" class="title">Class Diagram</text>

<rect x="45" y="100" width="240" height="310" class="box"/><text x="165" y="135" text-anchor="middle" class="txt">Student</text><text x="65" y="180" class="small">student_id: str</text><text x="65" y="210" class="small">name: str</text>
<rect x="330" y="100" width="240" height="310" class="box"/><text x="450" y="135" text-anchor="middle" class="txt">Course</text><text x="350" y="180" class="small">course_code: str</text><text x="350" y="210" class="small">title: str</text><text x="350" y="240" class="small">credit: float</text>
<rect x="615" y="100" width="245" height="310" class="box"/><text x="737" y="135" text-anchor="middle" class="txt">StudentResultManager</text><text x="635" y="180" class="small">add_student()</text><text x="635" y="210" class="small">add_course()</text><text x="635" y="240" class="small">enter_marks()</text><text x="635" y="270" class="small">get_result_sheet()</text><text x="635" y="300" class="small">list_students()</text><text x="635" y="330" class="small">list_courses()</text>
<path d="M285 250 L330 250 M570 250 L615 250" class="line"/>
<text x="450" y="475" text-anchor="middle" class="small">Uses grading.calculate_grade() and cgpa.calculate_cgpa()</text>

